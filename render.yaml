# Configuración de despliegue en Render (Blueprint)
# Backend: Web Service (Node) + Frontend: Static Site

services:
  - type: web
    name: memorize-backend
    runtime: node
    plan: free
    branch: main
    buildCommand: npm --prefix backend ci && npm --prefix backend run prisma:generate && npm --prefix backend run build && npm --prefix backend run prisma:deploy
    startCommand: npm --prefix backend run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://memorize-evolutivo.onrender.com,https://memorize-frontend.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

  - type: web
    name: memorize-frontend
    runtime: static
    branch: main
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://memorize-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
